[project]
name = "meeting-transcriber"
version = "0.1.0"
description = "App transcribe cuộc họp (local Whisper) + MCP server cho Claude"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "faster-whisper>=1.1.0",
    "mlx-whisper>=0.4.3",
    "httpx>=0.27",
    "mcp>=1.2.0",
    "sherpa-onnx>=1.13.4",
    "noisereduce>=3.0.3",
]

[tool.uv]
# Pin Python 3.12 — tránh thiếu wheel ML (ctranslate2) trên 3.14

[dependency-groups]
dev = [
    "mypy>=2.2.0",
    "pytest>=9.1.1",
    "ruff>=0.15.21",
]
# Chỉ cho benchmark ASR (scripts/bench_cloud_stt.py) — không nằm trong deps
# runtime để `uv sync` mặc định vẫn gọn. Cài khi cần: `uv sync --group bench`.
bench = [
    "mlx-qwen3-asr>=0.3.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F (pyflakes+pycodestyle), I (isort), B (bugbear), UP (pyupgrade).
select = ["E", "F", "I", "B", "UP"]
# BLE001 (blind except) là có chủ đích khắp code (never-fail pass 2, decode) — đã kèm noqa tại chỗ.
ignore = ["E501"]  # dòng dài trong static/comment; line-length lo phần code.

[tool.mypy]
python_version = "3.12"
files = ["app", "mcp_server"]
# Thư viện ML (mlx_whisper, faster_whisper, numpy nội bộ) không ship type stubs.
ignore_missing_imports = true
check_untyped_defs = true
