# Manju Enterprise on Fly: one always-on machine, SQLite text DB on a volume.
# Deployed by .github/workflows/fly-deploy.yml. Change `app` to your own name
# (it becomes https://<app>.fly.dev).
app = "mse-manju"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  # Messup Enterprise của công ty (FR-12). Xoá dòng này nếu không dùng.
  MESSUP_URL = "https://mse-messup.fly.dev"

[mounts]
  source = "manju_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  # Live meetings hold a WebSocket open; a stopped machine would cut them off.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/"
    interval = "30s"
    timeout = "5s"
    grace_period = "60s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
