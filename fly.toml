# Manju Enterprise trên Fly.io — 1 máy, SQLite trên volume /data (FR-11 US-906).
# Tên app lấy từ repo variable FLY_APP trong workflow (mặc định mse-manju).
app = "mse-manju"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  MANJU_EDITION = "enterprise"
  MANJU_DATA_DIR = "/data"

[mounts]
  source = "manju_data"
  destination = "/data"
  initial_size = "1gb"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"      # giữ máy chạy: WebSocket live + không cold start
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 100
    hard_limit = 200

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
